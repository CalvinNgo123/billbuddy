<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Buddy</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js for local client-side OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4 pb-20 font-sans">

    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- Header -->
        <header class="text-center pt-4">
            <h1 class="text-2xl font-bold text-slate-900">Bill Buddy 🧾😊</h1>
            <p class="text-sm text-slate-500">Scan, split, and calculate totals instantly</p>
        </header>

        <!-- Step 1: Camera / Photo Library Capture -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="font-semibold text-slate-700">1. Add Receipt</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <!-- Direct Camera Capture -->
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-xl p-4 text-center hover:border-blue-400 transition cursor-pointer bg-slate-50">
                    <input type="file" accept="image/*" capture="environment" onchange="handleReceiptUpload(event)" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="text-xs font-semibold text-slate-700">Take Photo</span>
                    <span class="text-[10px] text-slate-400">Open Camera</span>
                </label>

                <!-- Photo Library Picker (No capture attribute so iOS opens album picker) -->
                <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-200 rounded-xl p-4 text-center hover:border-blue-400 transition cursor-pointer bg-slate-50">
                    <input type="file" accept="image/*" onchange="handleReceiptUpload(event)" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-500 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span class="text-xs font-semibold text-slate-700">Photo Library</span>
                    <span class="text-[10px] text-slate-400">Choose existing</span>
                </label>
            </div>

            <div id="loadingStatus" class="hidden text-center text-sm text-blue-600 font-medium animate-pulse pt-2">
                Scanning receipt locally... Please wait.
            </div>
        </section>

        <!-- Step 2: Manage People -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="font-semibold text-slate-700">2. Add People</h2>
            <div class="flex gap-2">
                <input type="text" id="personNameInput" placeholder="Enter name..." class="flex-1 border border-slate-200 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addPerson()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-blue-700 transition">+</button>
            </div>
            <div id="peopleList" class="flex flex-wrap gap-2 pt-1">
                <!-- Dynamically injected people chips -->
            </div>
        </section>

        <!-- Step 3: Items & Assignment -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="font-semibold text-slate-700">3. Items & Split</h2>
                <button onclick="addItemRow()" class="text-xs text-blue-600 font-semibold hover:underline">+ Add Custom Item</button>
            </div>
            <div id="itemsContainer" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                <p class="text-xs text-slate-400 text-center py-4">No items scanned yet. Scan a receipt or add items manually.</p>
            </div>
        </section>

        <!-- Step 4: Tax, Tip & Totals -->
        <section class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <h2 class="font-semibold text-slate-700">4. Tax & Tip</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-slate-500 block mb-1">Tax ($)</label>
                    <input type="number" id="taxInput" value="0.00" step="0.01" oninput="calculateTotals()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="text-xs text-slate-500 block mb-1">Tip Presets</label>
                    <select id="tipPreset" onchange="applyTipPreset()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="0">Custom / 0%</option>
                        <option value="15">15%</option>
                        <option value="18">18%</option>
                        <option value="20">20%</option>
                        <option value="25">25%</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="text-xs text-slate-500 block mb-1">Tip Amount ($)</label>
                <input type="number" id="tipInput" value="0.00" step="0.01" oninput="calculateTotals()" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </section>

        <!-- Step 5: Summary Breakdown -->
        <section class="bg-slate-900 text-white p-5 rounded-2xl shadow-lg space-y-4">
            <h2 class="font-semibold text-slate-200">Summary Breakdown</h2>
            <div id="summaryContainer" class="space-y-3 divide-y divide-slate-800">
                <p class="text-xs text-slate-400 text-center py-2">Add people and assign items to view breakdown.</p>
            </div>
        </section>
    </div>

    <script>
        let people = [];
        let items = [];

        // Add Person
        function addPerson() {
            const input = document.getElementById('personNameInput');
            const name = input.value.trim();
            if (name && !people.includes(name)) {
                people.push(name);
                input.value = '';
                renderPeople();
                renderItems();
                calculateTotals();
            }
        }

        function removePerson(name) {
            people = people.filter(p => p !== name);
            items.forEach(item => {
                item.assignedTo = item.assignedTo.filter(p => p !== name);
            });
            renderPeople();
            renderItems();
            calculateTotals();
        }

        function renderPeople() {
            const container = document.getElementById('peopleList');
            if (people.length === 0) {
                container.innerHTML = '<span class="text-xs text-slate-400 italic">No people added yet.</span>';
                return;
            }
            container.innerHTML = people.map(p => `
                <span class="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-xs px-3 py-1.5 rounded-full font-medium border border-blue-100">
                    ${p}
                    <button onclick="removePerson('${p}')" class="text-blue-400 hover:text-blue-700 ml-1 font-bold">&times;</button>
                </span>
            `).join('');
        }

        // Add Manual Item Row
        function addItemRow(name = '', price = '') {
            items.push({ id: Date.now() + Math.random(), name, price: parseFloat(price) || 0, assignedTo: [] });
            renderItems();
        }

        function removeItem(id) {
            items = items.filter(i => i.id !== id);
            renderItems();
            calculateTotals();
        }

        function updateItem(id, field, value) {
            const item = items.find(i => i.id === id);
            if (item) {
                if (field === 'price') item.price = parseFloat(value) || 0;
                if (field === 'name') item.name = value;
                calculateTotals();
            }
        }

        function toggleAssignment(itemId, person) {
            const item = items.find(i => i.id === itemId);
            if (item) {
                const index = item.assignedTo.indexOf(person);
                if (index > -1) {
                    item.assignedTo.splice(index, 1);
                } else {
                    item.assignedTo.push(person);
                }
                renderItems();
                calculateTotals();
            }
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            if (items.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">No items added yet.</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                    <div class="flex gap-2 items-center">
                        <input type="text" value="${item.name}" placeholder="Item name" oninput="updateItem(${item.id}, 'name', this.value)" class="flex-1 bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <input type="number" value="${item.price || ''}" placeholder="0.00" step="0.01" oninput="updateItem(${item.id}, 'price', this.value)" class="w-20 bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <button onclick="removeItem(${item.id})" class="text-slate-400 hover:text-red-500 text-sm px-1">&times;</button>
                    </div>
                    <div class="flex flex-wrap gap-1 items-center pt-1">
                        <span class="text-[10px] text-slate-400 uppercase tracking-wider mr-1">Split:</span>
                        ${people.length === 0 ? '<span class="text-[10px] text-slate-400 italic">Add people first</span>' : 
                            people.map(p => {
                                const isAssigned = item.assignedTo.includes(p);
                                return `<button onclick="toggleAssignment(${item.id}, '${p}')" class="text-[11px] px-2 py-0.5 rounded-md font-medium transition ${isAssigned ? 'bg-blue-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}">${p}</button>`;
                            }).join('')
                        }
                    </div>
                </div>
            `).join('');
        }

        // Tip Preset Logic
        function applyTipPreset() {
            const preset = parseFloat(document.getElementById('tipPreset').value);
            const subtotal = items.reduce((sum, item) => sum + item.price, 0);
            const tipInput = document.getElementById('tipInput');
            if (preset > 0) {
                tipInput.value = ((subtotal * preset) / 100).toFixed(2);
            } else {
                tipInput.value = "0.00";
            }
            calculateTotals();
        }

        // OCR Processing via Tesseract.js
        async function handleReceiptUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('loadingStatus');
            status.classList.remove('hidden');

            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(file);
                await worker.terminate();

                parseReceiptText(ret.data.text);
            } catch (err) {
                console.error(err);
                alert('Failed to scan receipt locally. Please add items manually.');
            } finally {
                status.classList.add('hidden');
                e.target.value = ''; // reset input selector
            }
        }

        // Simple Heuristic Text Parser for Receipts
        function parseReceiptText(text) {
            items = []; 
            const lines = text.split('\n');
            const priceRegex = /(\d+\.\d{2})/g;

            lines.forEach(line => {
                const matches = line.match(priceRegex);
                if (matches && matches.length > 0) {
                    const price = parseFloat(matches[matches.length - 1]);
                    let name = line.replace(priceRegex, '').trim();
                    name = name.replace(/[^a-zA-Z0-9\s]/g, '').trim();
                    
                    if (name.length > 1 && price < 500) {
                        items.push({ id: Date.now() + Math.random(), name, price, assignedTo: [] });
                    }
                }
            });

            if (items.length === 0) {
                items.push({ id: Date.now(), name: "Scanned Receipt Item", price: 0.00, assignedTo: [] });
            }

            renderItems();
            calculateTotals();
        }

        // Calculation Engine
        function calculateTotals() {
            const taxTotal = parseFloat(document.getElementById('taxInput').value) || 0;
            const tipTotal = parseFloat(document.getElementById('tipInput').value) || 0;

            const subtotal = items.reduce((sum, item) => sum + item.price, 0);

            const personTotals = {};
            people.forEach(p => personTotals[p] = { subtotal: 0, items: [] });

            items.forEach(item => {
                const count = item.assignedTo.length;
                if (count > 0) {
                    const share = item.price / count;
                    item.assignedTo.forEach(p => {
                        if (personTotals[p]) {
                            personTotals[p].subtotal += share;
                            personTotals[p].items.push(`${item.name} (${(share).toFixed(2)})`);
                        }
                    });
                }
            });

            const container = document.getElementById('summaryContainer');
            if (people.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">Add people and assign items to view breakdown.</p>';
                return;
            }

            let html = '';
            people.forEach(p => {
                const pSub = personTotals[p].subtotal;
                const pTax = subtotal > 0 ? (pSub / subtotal) * taxTotal : 0;
                const pTip = subtotal > 0 ? (pSub / subtotal) * tipTotal : 0;
                const pGrandTotal = pSub + pTax + pTip;

                html += `
                    <div class="pt-3 first:pt-0 space-y-1">
                        <div class="flex justify-between font-bold text-sm">
                            <span>${p}</span>
                            <span class="text-blue-400">$${pGrandTotal.toFixed(2)}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 flex justify-between">
                            <span>Sub: $${pSub.toFixed(2)} + Tax: $${pTax.toFixed(2)} + Tip: $${pTip.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
